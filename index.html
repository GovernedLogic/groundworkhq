<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#020608">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'; img-src 'self' data:; media-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'">
  <title>Groundwork | DreamHome Presentation</title>
  <meta name="description" content="A private Groundwork presentation for DreamHome.">
  <link rel="canonical" href="https://groundworkhq.net/">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/logo.mp4" as="video" type="video/mp4">
  <link rel="stylesheet" href="style.css?v=entrance-20261120">
  <script src="app.js?v=entrance-20261120" defer></script>
</head>
<body data-state="intro">
  <main class="experience">
    <section class="entrance" id="entrance" aria-label="Groundwork presentation access">
      <div class="entrance__frame">
        <video class="logo-film" id="logo-film" src="assets/logo.mp4" playsinline preload="auto" disablepictureinpicture disableremoteplayback aria-label="Animated Groundwork logo"></video>
      </div>
      <button class="sound-control" id="logo-sound" type="button" hidden>Play logo with sound</button>
      <button class="entry-choice" id="entry-choice" type="button" hidden>View presentation</button>
      <div class="access" id="access" hidden>
        <h1 class="access__title">DreamHome presentation</h1>
        <p class="access__copy" id="access-copy">Enter the presentation access code.</p>
        <form class="access__form" id="access-form" action="#" method="post" novalidate>
          <label class="access__label" for="access-code">Access code</label>
          <div class="access__row">
            <input class="access__input" id="access-code" name="code" type="password" inputmode="numeric" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="access-copy access-error" required>
            <button class="access__submit" type="submit">Enter presentation</button>
          </div>
          <p class="access__error" id="access-error" role="alert" hidden>That code did not work.</p>
        </form>
      </div>
    </section>
    <section class="presentation" id="presentation" aria-label="DreamHome presentation" hidden>
      <div class="player" id="player">
        <video class="player__video" id="film" playsinline preload="metadata" disablepictureinpicture disableremoteplayback aria-label="Groundwork DreamHome presentation"></video>
        <div class="player__shade" aria-hidden="true"></div>
        <button class="player__action" id="primary-action" type="button" aria-label="Begin presentation">
          <span class="player__action-mark" aria-hidden="true"></span>
          <span id="primary-label">Begin presentation</span>
        </button>
        <div class="controls" id="controls" aria-label="Presentation controls">
          <button class="control control--play" id="play-toggle" type="button" aria-label="Play presentation">
            <span class="control__glyph" aria-hidden="true" id="play-symbol" data-icon="play"></span>
          </button>
          <label class="sr-only" for="progress">Presentation progress</label>
          <input class="progress" id="progress" type="range" min="0" max="1000" value="0" step="1">
          <output class="time" id="time" for="progress">0:00 / 4:59</output>
          <button class="control" id="mute-toggle" type="button" aria-label="Mute presentation"><span aria-hidden="true" id="volume-symbol">VOL</span></button>
          <label class="sr-only" for="volume">Volume</label>
          <input class="volume" id="volume" type="range" min="0" max="1" value="1" step="0.05">
          <button class="control" id="fullscreen-toggle" type="button" aria-label="Enter fullscreen"><span aria-hidden="true">FULL</span></button>
        </div>
        <div class="player__status sr-only" id="player-status" aria-live="polite"></div>
      </div>
    </section>
  </main>
</body>
</html>
