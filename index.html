<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Springfield DreamHome · Groundwork</title>
<link rel="icon" href="favicon.png" type="image/png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  .slide {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    object-fit: cover; display: block;
    background: #000; border: 0; outline: 0; cursor: pointer;
  }
  @media (max-aspect-ratio: 4/3) { .slide { object-fit: contain; } }
  .slide::-webkit-media-controls,
  .slide::-webkit-media-controls-enclosure,
  .slide::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
  .play {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 2; padding: 14px 38px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.55); background: rgba(0,0,0,.45); color: #fff;
    font: 500 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .18em; text-transform: uppercase;
    cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: background .2s, transform .2s;
  }
  .play:hover { background: rgba(255,255,255,.12); transform: translate(-50%, -50%) scale(1.03); }
  .play:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .play[hidden] { display: none; }
</style>
</head>
<body>
<!-- Video slot: swap assets/main.mp4 with a file of the same name. No other change needed. -->
<video class="slide" id="film" src="assets/main.mp4#t=0.001" loop playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
<button class="play" id="play" type="button" aria-label="Begin the film with sound">Begin</button>
<script>
(function () {
  var v = document.getElementById('film'), p = document.getElementById('play');
  function start() {
    v.muted = false; v.volume = 1;
    var r = v.play(); if (r && r.catch) r.catch(function () { p.hidden = false; });
  }
  p.addEventListener('click', start);
  v.addEventListener('click', function () { if (v.paused) start(); else v.pause(); });
  v.addEventListener('play', function () { p.hidden = true; });
  v.addEventListener('pause', function () { p.hidden = false; p.focus(); });
})();
</script>
</body>
</html>
